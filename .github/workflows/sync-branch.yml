name: sync-branch
on:
  push:
    paths:
      - '.github/workflows/sync-branch.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.1/experience-integration
          fetch-depth: 0
      - name: Delete the two probe branches and reset the tip
        run: |
          set +e
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads"
          for b in ci-log tmp-bin-probe; do
            curl -s -o /dev/null -w "delete $b -> %{http_code}\n" -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api/$b"
          done
          curl -fsSL -o /tmp/li.bundle "https://aka.doubaocdn.com/s/2Y4oBHDp7z"
          git fetch --no-tags /tmp/li.bundle 'refs/heads/*:refs/remotes/bundle/*'
          git reset --hard bundle/v5.1/experience-integration
          git push --force origin HEAD:refs/heads/v5.1/experience-integration
