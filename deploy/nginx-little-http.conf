# Step 1 (before the certificate exists): /etc/nginx/conf.d/little.quinnverse.tech.conf
server {
    listen 80;
    server_name little.quinnverse.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; }
}
