# Step 2 (after certbot succeeded): replaces nginx-little-http.conf at the same path
# /etc/nginx/conf.d/little.quinnverse.tech.conf. Only this vhost; no other site is touched.
server {
    listen 80;
    server_name little.quinnverse.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;   # nginx < 1.25: remove this line and use "listen 443 ssl http2;"
    server_name little.quinnverse.tech;

    ssl_certificate     /etc/letsencrypt/live/little.quinnverse.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/little.quinnverse.tech/privkey.pem;

    # Site ZIPs can be up to 50 MB.
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
